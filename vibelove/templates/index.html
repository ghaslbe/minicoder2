<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibelove Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">
    <!-- LEFT: Form & Logs -->
    <div class="w-1/2 h-full flex flex-col p-4 border-r border-gray-300 bg-white">
        <h1 class="text-xl font-bold mb-4">Vibelove Builder</h1>
        <form id="buildForm" class="flex flex-col gap-2">
            <textarea
                id="instruction"
                name="instruction"
                class="w-full h-32 p-2 border border-gray-300 rounded shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
                placeholder="Beschreibe deine App..."
            ></textarea>
            <button
                type="submit"
                id="buildButton"
                class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition-colors"
            >
                Bauen
            </button>
            <button
                type="button"
                id="resetButton"
                class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
            >
                Verlauf zurücksetzen
            </button>
            <a
                href="/download-zip"
                class="inline-block bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm text-center no-underline"
            >
                Projekt als ZIP herunterladen
            </a>
        </form>
        <div class="mt-4 flex-grow overflow-auto bg-gray-900 text-green-400 p-3 rounded font-mono text-sm">
            <pre id="logOutput" class="whitespace-pre-wrap">Warte auf Bauanweisung...</pre>
        </div>
    </div>

    <!-- RIGHT: Live Preview mit Werkzeugleiste -->
    <div class="w-1/2 h-full flex flex-col">
        <div class="flex items-center gap-2 bg-gray-100 border-b border-gray-300 px-3 py-2">
            <span class="text-sm font-medium text-gray-600 mr-auto">Preview</span>
            <span id="buildStatus" class="text-sm text-yellow-600 font-medium hidden items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-yellow-500 inline-block"></span>
                arbeitet …
            </span>
            <button
                type="button"
                onclick="reloadPreview()"
                class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
            >
                Preview neu laden
            </button>
            <button
                type="button"
                id="restartViteBtn"
                onclick="restartVite()"
                class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
            >
                Vite neu starten
            </button>
        </div>
        <iframe
            id="previewFrame"
            src="http://localhost:5173"
            class="flex-grow"
            style="width:100%;border:none;"
        ></iframe>
    </div>

    <script>
        const form = document.getElementById('buildForm');
        const logOutput = document.getElementById('logOutput');
        const buildButton = document.getElementById('buildButton');
        const resetButton = document.getElementById('resetButton');
        const instructionInput = document.getElementById('instruction');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const instruction = instructionInput.value;
            if (!instruction) return;

            buildButton.disabled = true;
            buildButton.innerText = 'Baut …';
            buildButton.classList.add('animate-pulse');

            const statusEl = document.getElementById('buildStatus');
            const statusDot = statusEl.querySelector('span');
            statusEl.classList.remove('hidden');
            statusEl.classList.add('flex');
            statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500 inline-block animate-pulse';
            statusEl.lastChild.textContent = ' arbeitet …';

            const separator = '\n\n=== Anweisung: ' + instruction + ' ===\n';
            logOutput.textContent += separator;

            try {
                const response = await fetch('/build', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `instruction=${encodeURIComponent(instruction)}`
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    logOutput.textContent += decoder.decode(value, { stream: true });
                    logOutput.scrollTop = logOutput.scrollHeight;
                }

                instructionInput.value = '';
            } catch (err) {
                logOutput.textContent += '\nFehler: ' + err.message;
            } finally {
                buildButton.disabled = false;
                buildButton.innerText = 'Bauen';
                buildButton.classList.remove('animate-pulse');

                // Fertig-Meldung im Status-Indikator, dann Preview laden und kurz danach ausblenden
                statusDot.className = 'w-2 h-2 rounded-full bg-green-500 inline-block';
                statusEl.lastChild.textContent = ' fertig — Preview neu geladen';
                reloadPreview();
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                    statusEl.classList.remove('flex');
                    statusDot.className = '';
                    statusEl.lastChild.textContent = '';
                }, 2500);
            }
        };

        resetButton.onclick = async () => {
            if (!confirm('Möchtest du den Verlauf wirklich zurücksetzen?')) return;

            try {
                const response = await fetch('/reset', {
                    method: 'POST'
                });
                if (response.ok) {
                    logOutput.textContent = 'Verlauf wurde zurueckgesetzt.\nWarte auf Bauanweisung...';
                }
            } catch (err) {
                console.error('Reset failed:', err);
            }
        };
    </script>
<script>
    function reloadPreview() {
        const frame = document.getElementById('previewFrame');
        if (frame) {
            frame.src = frame.src;
        }
    }

    function restartVite() {
        const btn = document.getElementById('restartViteBtn');
        if (btn) btn.disabled = true;
        fetch('/restart-vite', { method: 'POST' })
            .then(function () { return new Promise(function (r) { setTimeout(r, 3000); }); })
            .then(function () { reloadPreview(); })
            .finally(function () {
                if (btn) btn.disabled = false;
            });
    }
</script>
</body>
</html>
