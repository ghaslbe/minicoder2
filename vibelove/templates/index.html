<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibelove Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">
    <!-- LEFT: Form & Logs -->
    <div class="w-1/2 h-full flex flex-col p-4 border-r border-gray-300 bg-white">
        <h1 class="text-xl font-bold mb-4">Vibelove Builder</h1>
        <div class="flex items-center gap-2 mb-3">
            <label for="projektSelect" class="text-sm font-medium text-gray-600">Projekt:</label>
            <select
                id="projektSelect"
                class="flex-1 p-1.5 border border-gray-300 rounded text-sm bg-white"
            ></select>
            <button
                type="button"
                id="gitButton"
                class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
            >
                Git
            </button>
            <button
                type="button"
                id="neuesProjektBtn"
                class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
            >
                Neues Projekt
            </button>
        </div>
        <form id="buildForm" class="flex flex-col gap-2">
            <textarea
                id="instruction"
                name="instruction"
                class="w-full h-32 p-2 border border-gray-300 rounded shadow-sm focus:ring-2 focus:ring-blue-500 outline-none"
                placeholder="Beschreibe deine App..."
            ></textarea>
            <button
                type="submit"
                id="buildButton"
                class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition-colors"
            >
                Bauen
            </button>
            <button
                type="button"
                id="resetButton"
                class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
            >
                Verlauf zurücksetzen
            </button>
            <a
                href="/download-zip"
                class="inline-block bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm text-center no-underline"
            >
                Projekt als ZIP herunterladen
            </a>
        </form>
        <div class="mt-4 flex-grow overflow-auto bg-gray-900 text-green-400 p-3 rounded font-mono text-sm">
            <pre id="logOutput" class="whitespace-pre-wrap">Warte auf Bauanweisung...</pre>
        </div>
        <button
            type="button"
            id="settingsButton"
            class="mt-2 w-full bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
        >
            Einstellungen
        </button>
    </div>

    <!-- RIGHT: Live Preview mit Werkzeugleiste -->
    <div class="w-1/2 h-full flex flex-col">
        <div class="flex items-center gap-2 bg-gray-100 border-b border-gray-300 px-3 py-2">
            <span class="text-sm font-medium text-gray-600 mr-auto">Preview</span>
            <span id="buildStatus" class="text-sm text-yellow-600 font-medium hidden items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-yellow-500 inline-block"></span>
                arbeitet …
            </span>
            <div class="flex items-center gap-1">
                <button
                    type="button"
                    data-width="375"
                    onclick="setPreviewWidth('375')"
                    class="preview-width-btn bg-gray-200 text-gray-700 font-medium py-1 px-2.5 rounded hover:bg-gray-300 transition-colors text-sm"
                    title="Mobil (375px)"
                >
                    375px
                </button>
                <button
                    type="button"
                    data-width="768"
                    onclick="setPreviewWidth('768')"
                    class="preview-width-btn bg-gray-200 text-gray-700 font-medium py-1 px-2.5 rounded hover:bg-gray-300 transition-colors text-sm"
                    title="Tablet (768px)"
                >
                    768px
                </button>
                <button
                    type="button"
                    data-width="desktop"
                    onclick="setPreviewWidth('desktop')"
                    class="preview-width-btn bg-gray-700 text-white font-medium py-1 px-2.5 rounded hover:bg-gray-300 transition-colors text-sm"
                    title="Volle Breite"
                >
                    Desktop
                </button>
            </div>
            <button
                type="button"
                onclick="reloadPreview()"
                class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
            >
                Preview neu laden
            </button>
            <button
                type="button"
                id="restartViteBtn"
                onclick="restartVite()"
                class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
            >
                Vite neu starten
            </button>
        </div>
        <div id="previewWrapper" class="flex-grow flex items-center justify-center bg-gray-200 overflow-auto">
            <iframe
                id="previewFrame"
                src="http://localhost:5173"
                style="width:100%;height:100%;border:none;transition:width 0.3s;background:white;"
            ></iframe>
        </div>
    </div>

    <!-- MC-EINSTELLUNGEN MODAL (unsichtbar bis geoeffnet) -->
    <div id="settingsModal" class="hidden fixed top-0 left-0 w-full h-full bg-gray-900/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm mx-4">
            <h2 class="text-lg font-bold mb-4 text-gray-800">MC-Einstellungen</h2>
            <form id="settingsForm" class="flex flex-col gap-3">
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">Modell
                    <input type="text" id="settingModel" placeholder="z.B. gemma3:12b" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">Endpunkt / Base URL
                    <input type="text" id="settingBaseUrl" placeholder="z.B. http://localhost:11434/api/chat" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">API Key
                    <input type="password" id="settingApiKey" autocomplete="off" placeholder="API Key nicht gesetzt" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <button type="button" id="resetApiKeyBtn" class="self-start text-xs text-blue-600 hover:text-blue-800 underline">Key auf Env zurücksetzen</button>
                <p id="resetApiKeyStatus" class="hidden text-xs text-green-600"></p>
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">Max. Schritte
                    <input type="number" id="settingMaxSteps" min="1" step="1" value="100" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <div class="flex gap-2 mt-3 justify-end">
                    <button type="button" id="cancelSettingsBtn" class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm">Abbrechen</button>
                    <button type="submit" id="saveSettingsBtn" class="bg-blue-600 text-white font-medium py-1 px-3 rounded hover:bg-blue-700 transition-colors text-sm">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- GIT-REMOTE MODAL (unsichtbar bis geoeffnet) -->
    <div id="gitModal" class="hidden fixed top-0 left-0 w-full h-full bg-gray-900/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm mx-4">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Git-Remote</h2>
            <form id="gitForm" class="flex flex-col gap-3">
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">Remote-URL
                    <input type="text" id="remoteUrl" placeholder="z.B. git@github.com:name/projekt.git" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <pre id="gitOutput" class="hidden max-h-40 overflow-auto whitespace-pre-wrap bg-gray-900 text-green-400 p-3 rounded text-xs"></pre>
                <div class="flex flex-wrap gap-2 mt-3 justify-end">
                    <button type="button" id="pushGitBtn" class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm">Jetzt pushen</button>
                    <button type="button" id="closeGitBtn" class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm">Schliessen</button>
                    <button type="submit" id="saveGitBtn" class="bg-blue-600 text-white font-medium py-1 px-3 rounded hover:bg-blue-700 transition-colors text-sm">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('buildForm');
        const logOutput = document.getElementById('logOutput');
        const buildButton = document.getElementById('buildButton');
        const resetButton = document.getElementById('resetButton');
        const instructionInput = document.getElementById('instruction');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const instruction = instructionInput.value;
            if (!instruction) return;

            buildButton.disabled = true;
            buildButton.innerText = 'Baut …';
            buildButton.classList.add('animate-pulse');

            const statusEl = document.getElementById('buildStatus');
            const statusDot = statusEl.querySelector('span');
            statusEl.classList.remove('hidden');
            statusEl.classList.add('flex');
            statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500 inline-block animate-pulse';
            statusEl.lastChild.textContent = ' arbeitet …';

            const separator = '\n\n=== Anweisung: ' + instruction + ' ===\n';
            logOutput.textContent += separator;

            try {
                const response = await fetch('/build', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `instruction=${encodeURIComponent(instruction)}`
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    logOutput.textContent += decoder.decode(value, { stream: true });
                    logOutput.scrollTop = logOutput.scrollHeight;
                }

                instructionInput.value = '';
            } catch (err) {
                logOutput.textContent += '\nFehler: ' + err.message;
            } finally {
                buildButton.disabled = false;
                buildButton.innerText = 'Bauen';
                buildButton.classList.remove('animate-pulse');

                // Fertig-Meldung im Status-Indikator, dann Preview laden und kurz danach ausblenden
                statusDot.className = 'w-2 h-2 rounded-full bg-green-500 inline-block';
                statusEl.lastChild.textContent = ' fertig — Preview neu geladen';
                reloadPreview();
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                    statusEl.classList.remove('flex');
                    statusDot.className = '';
                    statusEl.lastChild.textContent = '';
                }, 2500);
            }
        };

        resetButton.onclick = async () => {
            if (!confirm('Möchtest du den Verlauf wirklich zurücksetzen?')) return;

            try {
                const response = await fetch('/reset', {
                    method: 'POST'
                });
                if (response.ok) {
                    logOutput.textContent = 'Verlauf wurde zurueckgesetzt.\nWarte auf Bauanweisung...';
                }
            } catch (err) {
                console.error('Reset failed:', err);
            }
        };

        // --- MC-Einstellungen Modal-Logik ---
        const settingsButton = document.getElementById('settingsButton');
        const settingsModal = document.getElementById('settingsModal');
        const settingsForm = document.getElementById('settingsForm');
        const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
        const resetApiKeyBtn = document.getElementById('resetApiKeyBtn');
        const settingsFeedback = document.getElementById('resetApiKeyStatus');

        settingsButton.onclick = async () => {
            try {
                const res = await fetch('/settings');
                if (!res.ok) throw new Error('GET /settings fehlgeschlagen');
                const data = await res.json();
                document.getElementById('settingModel').value = data.model || '';
                document.getElementById('settingBaseUrl').value = data.base_url || '';
                document.getElementById('settingMaxSteps').value = data.max_steps || 100;
                document.getElementById('settingApiKey').value = '';
                document.getElementById('settingApiKey').placeholder =
                    (data.api_key_gesetzt ? 'API Key bereits gesetzt' : 'API Key nicht gesetzt');
                settingsFeedback.textContent = '';
                settingsFeedback.classList.add('hidden');
            } catch (err) {
                logOutput.textContent += '\nFehler beim Laden der Einstellungen: ' + err.message;
            }
            settingsModal.classList.remove('hidden');
        };

        cancelSettingsBtn.onclick = () => settingsModal.classList.add('hidden');

        // Klick ausserhalb des Modals schliesst es
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.add('hidden');
        });

        settingsForm.onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                model: document.getElementById('settingModel').value.trim(),
                base_url: document.getElementById('settingBaseUrl').value.trim(),
                api_key: document.getElementById('settingApiKey').value,
                max_steps: document.getElementById('settingMaxSteps').value
            };
            try {
                const res = await fetch('/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('POST /settings fehlgeschlagen');
                logOutput.textContent += '\neinstellungen gespeichert ✓';
                logOutput.scrollTop = logOutput.scrollHeight;
            } catch (err) {
                logOutput.textContent += '\neinstellungen speichern fehlgeschlagen: ' + err.message;
            }
            settingsModal.classList.add('hidden');
        };

        resetApiKeyBtn.onclick = async () => {
            try {
                const res = await fetch('/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reset_api_key: true })
                });
                if (!res.ok) throw new Error('POST /settings fehlgeschlagen');
                document.getElementById('settingApiKey').value = '';
                document.getElementById('settingApiKey').placeholder = 'API Key aus Umgebung übernommen';
                settingsFeedback.textContent = 'Key aus Umgebung übernommen ✓';
                settingsFeedback.classList.remove('hidden', 'text-red-600');
                settingsFeedback.classList.add('text-green-600');
            } catch (err) {
                settingsFeedback.textContent = 'Zurücksetzen fehlgeschlagen: ' + err.message;
                settingsFeedback.classList.remove('hidden', 'text-green-600');
                settingsFeedback.classList.add('text-red-600');
            }
        };
    </script>
<script>
    function reloadPreview() {
        const frame = document.getElementById('previewFrame');
        if (frame) {
            frame.src = frame.src;
        }
    }

    function setPreviewWidth(width) {
        const frame = document.getElementById('previewFrame');
        if (!frame) return;
        const wrapper = document.getElementById('previewWrapper');
        if (width === 'desktop' || width === null || width === undefined) {
            frame.style.width = '100%';
            if (wrapper) wrapper.style.justifyContent = 'center';
        } else {
            frame.style.width = width + 'px';
            if (wrapper) wrapper.style.justifyContent = 'center';
        }
        document.querySelectorAll('.preview-width-btn').forEach(function (btn) {
            var isActive = btn.dataset.width === String(width);
            btn.classList.toggle('bg-gray-700', isActive);
            btn.classList.toggle('text-white', isActive);
            btn.classList.toggle('bg-gray-200', !isActive);
            btn.classList.toggle('text-gray-700', !isActive);
        });
    }

    // Standard: Desktop beim Laden aktivieren
    setPreviewWidth('desktop');

    function restartVite() {
        const btn = document.getElementById('restartViteBtn');
        if (btn) btn.disabled = true;
        fetch('/restart-vite', { method: 'POST' })
            .then(function () { return new Promise(function (r) { setTimeout(r, 3000); }); })
            .then(function () { reloadPreview(); })
            .finally(function () {
                if (btn) btn.disabled = false;
            });
    }

    // ── Projekt-Verwaltung ─────────────────────────────────────────────
    const projektSelect = document.getElementById('projektSelect');
    const neuesProjektBtn = document.getElementById('neuesProjektBtn');
    const gitButton = document.getElementById('gitButton');
    const gitModal = document.getElementById('gitModal');
    const gitForm = document.getElementById('gitForm');
    const remoteUrl = document.getElementById('remoteUrl');
    const gitOutput = document.getElementById('gitOutput');
    const closeGitBtn = document.getElementById('closeGitBtn');
    const pushGitBtn = document.getElementById('pushGitBtn');

    function zeigeGitAusgabe(text) {
        gitOutput.textContent = text;
        gitOutput.classList.remove('hidden');
    }

    gitButton.addEventListener('click', async function () {
        remoteUrl.value = '';
        gitOutput.classList.add('hidden');
        gitModal.classList.remove('hidden');
        try {
            const res = await fetch('/projects/remote');
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Remote konnte nicht geladen werden');
            remoteUrl.value = data.url || '';
        } catch (err) {
            zeigeGitAusgabe('Fehler: ' + err.message);
        }
    });

    closeGitBtn.addEventListener('click', () => gitModal.classList.add('hidden'));

    gitModal.addEventListener('click', function (e) {
        if (e.target === gitModal) gitModal.classList.add('hidden');
    });

    gitForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        try {
            const res = await fetch('/projects/remote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: remoteUrl.value.trim() })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Remote konnte nicht gespeichert werden');
            zeigeGitAusgabe('Remote gespeichert.');
        } catch (err) {
            zeigeGitAusgabe('Fehler: ' + err.message);
        }
    });

    pushGitBtn.addEventListener('click', async function () {
        zeigeGitAusgabe('Push wird ausgefuehrt ...');
        try {
            const res = await fetch('/projects/push', { method: 'POST' });
            const data = await res.json();
            zeigeGitAusgabe(data.ausgabe || (data.ok ? 'Push erfolgreich.' : 'Push fehlgeschlagen.'));
        } catch (err) {
            zeigeGitAusgabe('Fehler: ' + err.message);
        }
    });

    async function ladeProjekte() {
        try {
            const res = await fetch('/projects');
            const daten = await res.json();
            projektSelect.innerHTML = '';
            for (const p of daten.projekte) {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                if (p === daten.aktiv) opt.selected = true;
                projektSelect.appendChild(opt);
            }
        } catch (e) {
            console.error('Projektliste nicht ladbar:', e);
        }
    }

    async function projektAktivieren(name) {
        const res = await fetch('/projects/aktiv', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        if (res.ok) {
            document.getElementById('logOutput').textContent =
                'Projekt gewechselt zu "' + name + '".\nWarte auf Bauanweisung...';
            setTimeout(reloadPreview, 3500); // Vite braucht einen Moment
        }
    }

    projektSelect.addEventListener('change', function () {
        projektAktivieren(projektSelect.value);
    });

    neuesProjektBtn.addEventListener('click', async function () {
        const name = prompt('Name des neuen Projekts (Buchstaben/Zahlen/-/_):');
        if (!name) return;
        const res = await fetch('/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        if (res.ok) {
            await ladeProjekte();
            document.getElementById('logOutput').textContent =
                'Neues Projekt "' + name + '" angelegt und aktiv.\nWarte auf Bauanweisung...';
            reloadPreview();
        } else {
            alert('Projekt konnte nicht angelegt werden.');
        }
    });

    ladeProjekte();
</script>
</body>
</html>
