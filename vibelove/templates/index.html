<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibelove Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden">
    <!-- LEFT: kompakte Toolbar + Chat-Verlauf -->
    <div class="w-1/2 h-full flex flex-col border-r border-gray-300 bg-white">
        <!-- Kompakte Toolbar -->
        <div class="flex items-center gap-1.5 px-3 py-2 border-b border-gray-200">
            <h1 class="text-sm font-bold text-gray-800 mr-1 whitespace-nowrap">Vibelove</h1>
            <select
                id="projektSelect"
                class="flex-1 min-w-0 p-1 border border-gray-300 rounded text-xs bg-white"
            ></select>
            <button type="button" id="neuesProjektBtn" title="Neues Projekt"
                class="icon-btn">➕</button>
            <button type="button" id="gitButton" title="Git-Remote"
                class="icon-btn">🔗</button>
            <a href="/download-zip" title="Projekt als ZIP herunterladen"
                class="icon-btn no-underline">⬇️</a>
            <button type="button" id="containerButton" title="Container-Setup generieren (Dockerfile)"
                class="icon-btn">🐳</button>
            <button type="button" id="resetButton" title="Kontext-Verlauf zurücksetzen (nicht Git)"
                class="icon-btn">🔄</button>
            <button type="button" id="settingsButton" title="Einstellungen"
                class="icon-btn">⚙️</button>
        </div>

        <!-- Chat-Verlauf (aus Git-Historie des Projekts rekonstruiert) -->
        <div id="chatFeed" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2.5 bg-gray-50"></div>

        <!-- Eingabe unten, Chat-Stil -->
        <form id="buildForm" class="flex items-end gap-2 p-3 border-t border-gray-200 bg-white">
            <textarea
                id="instruction"
                name="instruction"
                rows="1"
                class="flex-1 resize-none max-h-32 p-2.5 border border-gray-300 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-blue-500 leading-snug"
                placeholder="Was soll gebaut/geändert werden?"
            ></textarea>
            <button
                type="submit"
                id="buildButton"
                title="Senden"
                class="shrink-0 w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
            >➤</button>
        </form>
    </div>

    <!-- RIGHT: Live Preview mit Werkzeugleiste (unveraendert) -->
    <div class="w-1/2 h-full flex flex-col">
        <div class="flex items-center gap-2 bg-gray-100 border-b border-gray-300 px-3 py-2">
            <div class="flex items-center gap-1 mr-auto">
                <button type="button" id="tabPreviewBtn" onclick="zeigeTab('preview')"
                    class="view-tab-btn bg-gray-700 text-white font-medium py-1 px-2.5 rounded text-sm">Vorschau</button>
                <button type="button" id="tabFilesBtn" onclick="zeigeTab('files')"
                    class="view-tab-btn bg-gray-200 text-gray-700 font-medium py-1 px-2.5 rounded text-sm">Dateien</button>
            </div>
            <span id="buildStatus" class="text-sm text-yellow-600 font-medium hidden items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-yellow-500 inline-block"></span>
                arbeitet …
            </span>
            <div id="previewControls" class="flex items-center gap-2">
                <div class="flex items-center gap-1">
                    <button
                        type="button"
                        data-width="375"
                        onclick="setPreviewWidth('375')"
                        class="preview-width-btn bg-gray-200 text-gray-700 font-medium py-1 px-2.5 rounded hover:bg-gray-300 transition-colors text-sm"
                        title="Mobil (375px)"
                    >
                        375px
                    </button>
                    <button
                        type="button"
                        data-width="768"
                        onclick="setPreviewWidth('768')"
                        class="preview-width-btn bg-gray-200 text-gray-700 font-medium py-1 px-2.5 rounded hover:bg-gray-300 transition-colors text-sm"
                        title="Tablet (768px)"
                    >
                        768px
                    </button>
                    <button
                        type="button"
                        data-width="desktop"
                        onclick="setPreviewWidth('desktop')"
                        class="preview-width-btn bg-gray-700 text-white font-medium py-1 px-2.5 rounded hover:bg-gray-300 transition-colors text-sm"
                        title="Volle Breite"
                    >
                        Desktop
                    </button>
                </div>
                <button
                    type="button"
                    onclick="reloadPreview()"
                    class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
                >
                    Preview neu laden
                </button>
                <button
                    type="button"
                    onclick="openPreviewInNewWindow()"
                    class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
                    title="Oeffnet die Live-Vorschau in einem eigenen Browser-Tab/-Fenster"
                >
                    In neuem Fenster öffnen
                </button>
                <button
                    type="button"
                    id="restartViteBtn"
                    onclick="restartVite()"
                    class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm"
                >
                    Vite neu starten
                </button>
            </div>
        </div>
        <div id="previewWrapper" class="flex-grow flex items-center justify-center bg-gray-200 overflow-auto">
            <iframe
                id="previewFrame"
                src="http://localhost:5173"
                style="width:100%;height:100%;border:none;transition:width 0.3s;background:white;"
            ></iframe>
        </div>

        <!-- Datei-Explorer: Liste links, Inhalt/Upload rechts (nur sichtbar im 'Dateien'-Tab) -->
        <div id="filesPanel" class="hidden flex-grow overflow-hidden flex">
            <div class="w-1/3 h-full overflow-y-auto border-r border-gray-300 bg-white">
                <div id="fileList" class="text-sm"></div>
            </div>
            <div class="flex-1 h-full flex flex-col overflow-hidden bg-gray-50">
                <form id="uploadForm" class="flex items-center gap-2 p-2 border-b border-gray-200 bg-white">
                    <input type="text" id="uploadDir" placeholder="Zielordner (leer = Projekt-Wurzel)"
                        class="flex-1 min-w-0 p-1.5 border border-gray-300 rounded text-xs">
                    <input type="file" id="uploadFileInput" class="text-xs flex-1 min-w-0">
                    <button type="submit"
                        class="bg-blue-600 text-white font-medium py-1 px-3 rounded hover:bg-blue-700 transition-colors text-sm whitespace-nowrap">
                        Hochladen
                    </button>
                </form>
                <p id="uploadStatus" class="hidden text-xs px-2 py-1"></p>
                <div id="fileViewer" class="flex-1 overflow-auto p-3">
                    <p class="text-sm text-gray-400">Datei links auswählen, um sie anzuzeigen.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MC-EINSTELLUNGEN MODAL (unsichtbar bis geoeffnet) -->
    <div id="settingsModal" class="hidden fixed top-0 left-0 w-full h-full bg-gray-900/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm mx-4">
            <h2 class="text-lg font-bold mb-4 text-gray-800">MC-Einstellungen</h2>
            <form id="settingsForm" class="flex flex-col gap-3">
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">Modell
                    <input type="text" id="settingModel" placeholder="z.B. gemma3:12b" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">Endpunkt / Base URL
                    <input type="text" id="settingBaseUrl" placeholder="z.B. http://localhost:11434/api/chat" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">API Key
                    <input type="password" id="settingApiKey" autocomplete="off" placeholder="API Key nicht gesetzt" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <button type="button" id="resetApiKeyBtn" class="self-start text-xs text-blue-600 hover:text-blue-800 underline">Key auf Env zurücksetzen</button>
                <p id="resetApiKeyStatus" class="hidden text-xs text-green-600"></p>
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">Max. Schritte
                    <input type="number" id="settingMaxSteps" min="1" step="1" value="100" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <div class="flex gap-2 mt-3 justify-end">
                    <button type="button" id="cancelSettingsBtn" class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm">Abbrechen</button>
                    <button type="submit" id="saveSettingsBtn" class="bg-blue-600 text-white font-medium py-1 px-3 rounded hover:bg-blue-700 transition-colors text-sm">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- GIT-REMOTE MODAL (unsichtbar bis geoeffnet) -->
    <div id="gitModal" class="hidden fixed top-0 left-0 w-full h-full bg-gray-900/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm mx-4">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Git-Remote</h2>
            <form id="gitForm" class="flex flex-col gap-3">
                <label class="flex flex-col gap-1 text-sm font-medium text-gray-600">Remote-URL
                    <input type="text" id="remoteUrl" placeholder="z.B. git@github.com:name/projekt.git" class="border border-gray-300 rounded px-2 py-1 outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <pre id="gitOutput" class="hidden max-h-40 overflow-auto whitespace-pre-wrap bg-gray-900 text-green-400 p-3 rounded text-xs"></pre>
                <div class="flex flex-wrap gap-2 mt-3 justify-end">
                    <button type="button" id="pushGitBtn" class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm">Jetzt pushen</button>
                    <button type="button" id="closeGitBtn" class="bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-sm">Schliessen</button>
                    <button type="submit" id="saveGitBtn" class="bg-blue-600 text-white font-medium py-1 px-3 rounded hover:bg-blue-700 transition-colors text-sm">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .icon-btn {
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            font-size: 0.9rem;
            background: transparent;
            transition: background-color 0.15s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background-color: #e5e7eb; }
        .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .file-list-item:hover { background-color: #f3f4f6; }
        .file-list-item.active { background-color: #dbeafe; }
    </style>

    <script>
        // ============================================================
        // Chat-Verlauf: rekonstruiert aus der Git-Historie des aktiven
        // Projekts (jeder saubere mc-Lauf erzeugt bereits einen eigenen
        // Commit) -- deshalb ueberlebt der Chat einen Seiten-Reload, ganz
        // ohne eine zweite, parallele Historie im Browser zu pflegen.
        // ============================================================
        const chatFeed = document.getElementById('chatFeed');
        const form = document.getElementById('buildForm');
        const buildButton = document.getElementById('buildButton');
        const resetButton = document.getElementById('resetButton');
        const containerButton = document.getElementById('containerButton');
        const instructionInput = document.getElementById('instruction');

        let gitCommits = []; // zuletzt geladene Commit-Liste des aktiven Projekts

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Muss zu mc.pys eigener Ausgabe passen: die finish-Zusammenfassung
        // steht als Zeile "✓ <text>" DIREKT vor der Token-/Kosten-Zeile
        // "Σ ... Requests" (siehe vibelove/server.py: _extract_run_summary,
        // dieselbe Logik hier client-seitig fuer die Chat-Bubble-Ueberschrift).
        const USAGE_LINE_RE = /^Σ \d+ Requests/m;
        const FINISH_LINE_RE = /^✓ (.+)$/gm;

        function extractSummary(fullText) {
            const usageMatch = USAGE_LINE_RE.exec(fullText);
            const vorUsage = usageMatch ? fullText.slice(0, usageMatch.index) : fullText;
            const matches = [...vorUsage.matchAll(FINISH_LINE_RE)];
            if (matches.length) return matches[matches.length - 1][1].trim();
            return null;
        }

        function appendSystemBubble(text) {
            const div = document.createElement('div');
            div.className = 'text-center text-xs text-gray-400 my-1 whitespace-pre-wrap';
            div.textContent = text;
            chatFeed.appendChild(div);
        }

        function appendUserBubble(text) {
            const wrap = document.createElement('div');
            wrap.className = 'flex justify-end';
            const bubble = document.createElement('div');
            bubble.className = 'bg-blue-600 text-white rounded-2xl rounded-br-sm px-3 py-2 max-w-[85%] text-sm whitespace-pre-wrap';
            bubble.textContent = text;
            wrap.appendChild(bubble);
            chatFeed.appendChild(wrap);
            chatFeed.scrollTop = chatFeed.scrollHeight;
            return wrap;
        }

        function machRollbackButton(commitHash, wrapEl) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'mt-1 text-xs text-gray-500 hover:text-red-600 underline block';
            btn.textContent = '↩ Rückgängig (Stand davor)';
            btn.onclick = () => rollbackZu(commitHash, wrapEl);
            return btn;
        }

        function appendAssistantBubble({ headline, rollbackTo, pending, model }) {
            const wrap = document.createElement('div');
            wrap.className = 'flex justify-start';
            const bubble = document.createElement('div');
            bubble.className = 'bg-white border border-gray-200 rounded-2xl rounded-bl-sm px-3 py-2 max-w-[85%] text-sm shadow-sm';

            const headlineEl = document.createElement('div');
            headlineEl.className = pending
                ? 'text-gray-500 italic'
                : 'text-gray-800 whitespace-pre-wrap';
            headlineEl.textContent = headline;
            bubble.appendChild(headlineEl);

            // Welches Modell diesen Lauf erzeugt hat (aus dem 'Modell:'-
            // Trailer im Commit-Body, siehe mc.pys git_commit_run()) -- nur
            // bei aelteren Commits VOR dieser Funktion fehlt es (dann kein
            // Badge statt eines irrefuehrenden 'unbekannt').
            if (model) {
                const modelEl = document.createElement('div');
                modelEl.className = 'text-xs text-gray-400 mt-0.5';
                modelEl.textContent = '🤖 ' + model;
                bubble.appendChild(modelEl);
            }

            if (rollbackTo) {
                bubble.appendChild(machRollbackButton(rollbackTo, wrap));
            }

            wrap.appendChild(bubble);
            chatFeed.appendChild(wrap);
            chatFeed.scrollTop = chatFeed.scrollHeight;
            return { wrap, bubble, headlineEl };
        }

        // Product-Owner-Bubbles (po.py): optisch abgesetzt vom Coder
        // (mc.py), damit klar ist, wer gerade spricht -- Rueckfrage ODER
        // eine fertige Spezifikation mit 'Bauen'/'Anpassen'.
        function appendPoLabel(bubble) {
            const label = document.createElement('div');
            label.className = 'text-xs text-indigo-500 font-semibold mb-1';
            label.textContent = '🧭 Product Owner';
            bubble.appendChild(label);
        }

        function appendPoQuestionBubble(question, raw) {
            const wrap = document.createElement('div');
            wrap.className = 'flex justify-start';
            const bubble = document.createElement('div');
            bubble.className = 'bg-indigo-50 border border-indigo-200 rounded-2xl rounded-bl-sm px-3 py-2 max-w-[85%] text-sm shadow-sm';
            appendPoLabel(bubble);
            const text = document.createElement('div');
            text.className = 'text-gray-800 whitespace-pre-wrap';
            text.textContent = question;
            bubble.appendChild(text);
            if (raw) fuegeDetailsHinzuMitLabel(bubble, 'Product-Owner-Denken', raw);
            wrap.appendChild(bubble);
            chatFeed.appendChild(wrap);
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        function appendPoSpecBubble(summary, instruction, raw, onBauen, onAnpassen) {
            const wrap = document.createElement('div');
            wrap.className = 'flex justify-start';
            const bubble = document.createElement('div');
            bubble.className = 'bg-indigo-50 border border-indigo-200 rounded-2xl rounded-bl-sm px-3 py-2 max-w-[85%] text-sm shadow-sm';
            appendPoLabel(bubble);
            const text = document.createElement('div');
            text.className = 'text-gray-800 whitespace-pre-wrap mb-2';
            text.textContent = summary;
            bubble.appendChild(text);

            const details = document.createElement('details');
            details.className = 'mb-2';
            const dsummary = document.createElement('summary');
            dsummary.className = 'text-xs text-indigo-600 cursor-pointer select-none';
            dsummary.textContent = 'Vollständiger Auftragstext';
            const pre = document.createElement('pre');
            pre.className = 'mt-1 max-h-40 overflow-auto whitespace-pre-wrap bg-white border border-gray-200 rounded p-2 text-xs';
            pre.textContent = instruction;
            details.appendChild(dsummary);
            details.appendChild(pre);
            bubble.appendChild(details);
            if (raw) fuegeDetailsHinzuMitLabel(bubble, 'Product-Owner-Denken', raw);

            const btnRow = document.createElement('div');
            btnRow.className = 'flex gap-2';
            const bauenBtn = document.createElement('button');
            bauenBtn.type = 'button';
            bauenBtn.className = 'bg-blue-600 text-white font-medium py-1 px-3 rounded hover:bg-blue-700 transition-colors text-xs';
            bauenBtn.textContent = 'Jetzt bauen';
            bauenBtn.onclick = () => { btnRow.remove(); onBauen(); };
            const anpassenBtn = document.createElement('button');
            anpassenBtn.type = 'button';
            anpassenBtn.className = 'bg-gray-200 text-gray-700 font-medium py-1 px-3 rounded hover:bg-gray-300 transition-colors text-xs';
            anpassenBtn.textContent = 'Text anpassen';
            anpassenBtn.onclick = () => { btnRow.remove(); onAnpassen(); };
            btnRow.appendChild(bauenBtn);
            btnRow.appendChild(anpassenBtn);
            bubble.appendChild(btnRow);

            wrap.appendChild(bubble);
            chatFeed.appendChild(wrap);
            chatFeed.scrollTop = chatFeed.scrollHeight;
        }

        function fuegeDetailsHinzuMitLabel(bubble, label, initialText) {
            const details = document.createElement('details');
            details.className = 'mt-1.5';
            details.open = true;
            const summary = document.createElement('summary');
            summary.className = 'text-xs text-blue-600 cursor-pointer select-none';
            summary.textContent = label;
            const pre = document.createElement('pre');
            pre.className = 'mt-1 max-h-56 overflow-auto whitespace-pre-wrap bg-gray-900 text-green-400 p-2 rounded text-xs';
            pre.textContent = initialText || '';
            details.appendChild(summary);
            details.appendChild(pre);
            bubble.appendChild(details);
            return pre;
        }

        function fuegeDetailsHinzu(bubble, initialText) {
            return fuegeDetailsHinzuMitLabel(bubble, 'Terminal-Details', initialText);
        }

        async function rollbackZu(commitHash, wrapEl) {
            if (!confirm('Wirklich auf den Stand VOR dieser Anweisung zurücksetzen? Alle Änderungen danach gehen unwiderruflich verloren.')) return;
            try {
                const res = await fetch('/projects/rollback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ commit: commitHash })
                });
                const data = await res.json();
                if (!data.ok) {
                    alert('Rollback fehlgeschlagen: ' + (data.error || 'unbekannter Fehler'));
                    return;
                }
                await ladeGitLogUndRenderChat();
                reloadPreview();
            } catch (err) {
                alert('Rollback fehlgeschlagen: ' + err.message);
            }
        }

        function renderChatAusGitLog() {
            chatFeed.innerHTML = '';
            if (!gitCommits.length) {
                appendSystemBubble('Noch kein Verlauf für dieses Projekt.');
                return;
            }
            gitCommits.forEach((c, i) => {
                if (i === 0) {
                    appendSystemBubble('🆕 Projekt erstellt');
                    return;
                }
                const msg = c.message.replace(/^mc:\s*/, '');
                appendAssistantBubble({ headline: msg, rollbackTo: c.parent, pending: false, model: c.model });
            });
        }

        async function ladeGitLogUndRenderChat() {
            try {
                const res = await fetch('/projects/git-log');
                const data = await res.json();
                gitCommits = data.commits || [];
            } catch (e) {
                gitCommits = [];
            }
            renderChatAusGitLog();
        }

        // Nach einem Bauauftrag: pruefen, ob ein NEUER Commit entstand (nur
        // dann gibt es ueberhaupt etwas zum Zuruecksetzen) und den Rollback-
        // Button an die GERADE gezeigte Bubble haengen, statt den kompletten
        // Chat neu zu rendern (die eben gestreamte Antwort bliebe sonst kurz
        // verschwunden, bis der Re-Render fertig ist).
        async function aktualisiereRollbackFuer(assistantBubble) {
            const vorherLetzterHash = gitCommits.length ? gitCommits[gitCommits.length - 1].hash : null;
            try {
                const res = await fetch('/projects/git-log');
                const data = await res.json();
                const neu = data.commits || [];
                gitCommits = neu;
                if (neu.length && neu[neu.length - 1].hash !== vorherLetzterHash) {
                    const letzter = neu[neu.length - 1];
                    if (letzter.parent) {
                        assistantBubble.bubble.appendChild(
                            machRollbackButton(letzter.parent, assistantBubble.wrap)
                        );
                    }
                }
            } catch (e) {
                // Git-Log nicht verfuegbar -> einfach keinen Rollback anbieten
            }
        }

        // --- Eingabefeld: automatisch mitwachsen (wie Chat-Apps ueblich) ---
        function autoResizeTextarea() {
            instructionInput.style.height = 'auto';
            instructionInput.style.height = Math.min(instructionInput.scrollHeight, 128) + 'px';
        }
        instructionInput.addEventListener('input', autoResizeTextarea);
        instructionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        // Ob der naechste Text im Eingabefeld eine ANTWORT auf eine
        // Rueckfrage von po.py ist (dann geht Senden wieder an /refine)
        // oder eine neue, unbeantwortete Aufgabe.
        let poDialogAktiv = false;

        function setzePoDialogAktiv(aktiv) {
            poDialogAktiv = aktiv;
            instructionInput.placeholder = aktiv
                ? 'Antwort an den Product Owner …'
                : 'Was soll gebaut/geändert werden?';
        }

        async function starteBauauftrag(instruction) {
            buildButton.disabled = true;

            const statusEl = document.getElementById('buildStatus');
            const statusDot = statusEl.querySelector('span');
            statusEl.classList.remove('hidden');
            statusEl.classList.add('flex');
            statusDot.className = 'w-2 h-2 rounded-full bg-yellow-500 inline-block animate-pulse';
            statusEl.lastChild.textContent = ' arbeitet …';

            const assistant = appendAssistantBubble({ headline: 'Baue …', rollbackTo: null, pending: true });
            const pre = fuegeDetailsHinzu(assistant.bubble, '');
            let rawText = '';

            try {
                const response = await fetch('/build', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `instruction=${encodeURIComponent(instruction)}`
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    rawText += decoder.decode(value, { stream: true });
                    pre.textContent = rawText;
                    pre.scrollTop = pre.scrollHeight;
                    chatFeed.scrollTop = chatFeed.scrollHeight;
                }
            } catch (err) {
                rawText += '\nFehler: ' + err.message;
                pre.textContent = rawText;
            } finally {
                const summary = extractSummary(rawText);
                assistant.headlineEl.textContent = summary || 'Lauf nicht sauber abgeschlossen — Details unten prüfen.';
                assistant.headlineEl.className = summary
                    ? 'text-gray-800 whitespace-pre-wrap'
                    : 'text-red-600 whitespace-pre-wrap';

                // Badge sofort zeigen (nicht erst nach dem naechsten Reload):
                // welches Modell diesen GERADE gelaufenen Bauauftrag erzeugt
                // hat, aus dem Einstellungsfeld ausgelesen (der Server hat
                // exakt diesen Wert fuer den /build-Aufruf verwendet).
                const laufendesModel = document.getElementById('settingModel')?.value;
                if (laufendesModel) {
                    const modelEl = document.createElement('div');
                    modelEl.className = 'text-xs text-gray-400 mt-0.5';
                    modelEl.textContent = '🤖 ' + laufendesModel;
                    assistant.bubble.appendChild(modelEl);
                }
                // Terminal-Details bleiben bewusst aufgeklappt, auch nach
                // Abschluss -- Nutzerwunsch: das Terminalfenster soll
                // sichtbar bleiben, nicht automatisch verschwinden.

                buildButton.disabled = false;
                setzePoDialogAktiv(false);

                statusDot.className = 'w-2 h-2 rounded-full bg-green-500 inline-block';
                statusEl.lastChild.textContent = ' fertig — Preview neu geladen';
                reloadPreview();
                ladeDateiListe();
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                    statusEl.classList.remove('flex');
                    statusDot.className = '';
                    statusEl.lastChild.textContent = '';
                }, 2500);

                await aktualisiereRollbackFuer(assistant);
            }
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const nachricht = instructionInput.value.trim();
            if (!nachricht) return;

            appendUserBubble(nachricht);
            instructionInput.value = '';
            autoResizeTextarea();
            buildButton.disabled = true;

            try {
                const res = await fetch('/refine', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: nachricht })
                });
                const decision = await res.json();

                if (decision.type === 'question') {
                    setzePoDialogAktiv(true);
                    appendPoQuestionBubble(decision.question, decision.raw);
                } else if (decision.type === 'spec') {
                    setzePoDialogAktiv(false);
                    appendPoSpecBubble(
                        decision.summary,
                        decision.instruction,
                        decision.raw,
                        () => starteBauauftrag(decision.instruction),
                        () => {
                            instructionInput.value = decision.instruction;
                            autoResizeTextarea();
                            instructionInput.focus();
                            setzePoDialogAktiv(true);
                        }
                    );
                } else {
                    appendSystemBubble('Product Owner: ' + (decision.error || 'unbekannter Fehler'));
                    if (decision.raw) {
                        const pre = document.createElement('pre');
                        pre.className = 'max-h-40 overflow-auto whitespace-pre-wrap bg-gray-900 text-green-400 p-2 rounded text-xs mx-auto max-w-[85%] mb-2';
                        pre.textContent = decision.raw;
                        chatFeed.appendChild(pre);
                    }
                }
            } catch (err) {
                appendSystemBubble('Product Owner nicht erreichbar: ' + err.message);
            } finally {
                buildButton.disabled = false;
            }
        };

        resetButton.onclick = async () => {
            if (!confirm('Kontext-Verlauf für den Assistenten zurücksetzen? (Betrifft nur, was mc.py und der Product Owner sich merken — NICHT die Git-Historie/den Chat.)')) return;
            try {
                const response = await fetch('/reset', { method: 'POST' });
                if (response.ok) {
                    setzePoDialogAktiv(false);
                    appendSystemBubble('Kontext-Verlauf zurückgesetzt.');
                }
            } catch (err) {
                console.error('Reset failed:', err);
            }
        };

        containerButton.onclick = async () => {
            containerButton.disabled = true;
            try {
                const response = await fetch('/generate-container', { method: 'POST' });
                const data = await response.json();
                if (!response.ok || !data.ok) {
                    appendSystemBubble('Container-Setup: ' + (data.error || 'Fehlgeschlagen.'));
                    return;
                }
                appendSystemBubble(
                    'Container-Setup generiert: ' + data.dateien.join(', ') +
                    '\nStart: ' + data.hinweis
                );
            } catch (err) {
                console.error('Container-Generierung fehlgeschlagen:', err);
                appendSystemBubble('Container-Setup: Anfrage fehlgeschlagen.');
            } finally {
                containerButton.disabled = false;
            }
        };

        // --- MC-Einstellungen Modal-Logik ---
        const settingsButton = document.getElementById('settingsButton');
        const settingsModal = document.getElementById('settingsModal');
        const settingsForm = document.getElementById('settingsForm');
        const cancelSettingsBtn = document.getElementById('cancelSettingsBtn');
        const resetApiKeyBtn = document.getElementById('resetApiKeyBtn');
        const settingsFeedback = document.getElementById('resetApiKeyStatus');

        settingsButton.onclick = async () => {
            try {
                const res = await fetch('/settings');
                if (!res.ok) throw new Error('GET /settings fehlgeschlagen');
                const data = await res.json();
                document.getElementById('settingModel').value = data.model || '';
                document.getElementById('settingBaseUrl').value = data.base_url || '';
                document.getElementById('settingMaxSteps').value = data.max_steps || 100;
                document.getElementById('settingApiKey').value = '';
                document.getElementById('settingApiKey').placeholder =
                    (data.api_key_gesetzt ? 'API Key bereits gesetzt' : 'API Key nicht gesetzt');
                settingsFeedback.textContent = '';
                settingsFeedback.classList.add('hidden');
            } catch (err) {
                appendSystemBubble('Fehler beim Laden der Einstellungen: ' + err.message);
            }
            settingsModal.classList.remove('hidden');
        };

        cancelSettingsBtn.onclick = () => settingsModal.classList.add('hidden');

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.add('hidden');
        });

        settingsForm.onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                model: document.getElementById('settingModel').value.trim(),
                base_url: document.getElementById('settingBaseUrl').value.trim(),
                api_key: document.getElementById('settingApiKey').value,
                max_steps: document.getElementById('settingMaxSteps').value
            };
            try {
                const res = await fetch('/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('POST /settings fehlgeschlagen');
                appendSystemBubble('Einstellungen gespeichert ✓');
            } catch (err) {
                appendSystemBubble('Einstellungen speichern fehlgeschlagen: ' + err.message);
            }
            settingsModal.classList.add('hidden');
        };

        resetApiKeyBtn.onclick = async () => {
            try {
                const res = await fetch('/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reset_api_key: true })
                });
                if (!res.ok) throw new Error('POST /settings fehlgeschlagen');
                document.getElementById('settingApiKey').value = '';
                document.getElementById('settingApiKey').placeholder = 'API Key aus Umgebung übernommen';
                settingsFeedback.textContent = 'Key aus Umgebung übernommen ✓';
                settingsFeedback.classList.remove('hidden', 'text-red-600');
                settingsFeedback.classList.add('text-green-600');
            } catch (err) {
                settingsFeedback.textContent = 'Zurücksetzen fehlgeschlagen: ' + err.message;
                settingsFeedback.classList.remove('hidden', 'text-green-600');
                settingsFeedback.classList.add('text-red-600');
            }
        };
    </script>
<script>
    function reloadPreview() {
        const frame = document.getElementById('previewFrame');
        if (frame) {
            frame.src = frame.src;
        }
    }

    // Oeffnet dieselbe Vorschau-URL wie das iframe in einem eigenen Tab --
    // nuetzlich fuer Spiele/Apps, die Tastatur-Fokus, volle Fenstergroesse
    // oder DevTools ohne den umgebenden Chat/Toolbar-Rahmen brauchen.
    function openPreviewInNewWindow() {
        const frame = document.getElementById('previewFrame');
        if (frame && frame.src) {
            window.open(frame.src, '_blank');
        }
    }

    function setPreviewWidth(width) {
        const frame = document.getElementById('previewFrame');
        if (!frame) return;
        const wrapper = document.getElementById('previewWrapper');
        if (width === 'desktop' || width === null || width === undefined) {
            frame.style.width = '100%';
            if (wrapper) wrapper.style.justifyContent = 'center';
        } else {
            frame.style.width = width + 'px';
            if (wrapper) wrapper.style.justifyContent = 'center';
        }
        document.querySelectorAll('.preview-width-btn').forEach(function (btn) {
            var isActive = btn.dataset.width === String(width);
            btn.classList.toggle('bg-gray-700', isActive);
            btn.classList.toggle('text-white', isActive);
            btn.classList.toggle('bg-gray-200', !isActive);
            btn.classList.toggle('text-gray-700', !isActive);
        });
    }

    // Standard: Desktop beim Laden aktivieren
    setPreviewWidth('desktop');

    function restartVite() {
        const btn = document.getElementById('restartViteBtn');
        if (btn) btn.disabled = true;
        fetch('/restart-vite', { method: 'POST' })
            .then(function () { return new Promise(function (r) { setTimeout(r, 3000); }); })
            .then(function () { reloadPreview(); })
            .finally(function () {
                if (btn) btn.disabled = false;
            });
    }

    // ── Projekt-Verwaltung ─────────────────────────────────────────────
    const projektSelect = document.getElementById('projektSelect');
    const neuesProjektBtn = document.getElementById('neuesProjektBtn');
    const gitButton = document.getElementById('gitButton');
    const gitModal = document.getElementById('gitModal');
    const gitForm = document.getElementById('gitForm');
    const remoteUrl = document.getElementById('remoteUrl');
    const gitOutput = document.getElementById('gitOutput');
    const closeGitBtn = document.getElementById('closeGitBtn');
    const pushGitBtn = document.getElementById('pushGitBtn');

    function zeigeGitAusgabe(text) {
        gitOutput.textContent = text;
        gitOutput.classList.remove('hidden');
    }

    gitButton.addEventListener('click', async function () {
        remoteUrl.value = '';
        gitOutput.classList.add('hidden');
        gitModal.classList.remove('hidden');
        try {
            const res = await fetch('/projects/remote');
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Remote konnte nicht geladen werden');
            remoteUrl.value = data.url || '';
        } catch (err) {
            zeigeGitAusgabe('Fehler: ' + err.message);
        }
    });

    closeGitBtn.addEventListener('click', () => gitModal.classList.add('hidden'));

    gitModal.addEventListener('click', function (e) {
        if (e.target === gitModal) gitModal.classList.add('hidden');
    });

    gitForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        try {
            const res = await fetch('/projects/remote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: remoteUrl.value.trim() })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Remote konnte nicht gespeichert werden');
            zeigeGitAusgabe('Remote gespeichert.');
        } catch (err) {
            zeigeGitAusgabe('Fehler: ' + err.message);
        }
    });

    pushGitBtn.addEventListener('click', async function () {
        zeigeGitAusgabe('Push wird ausgefuehrt ...');
        try {
            const res = await fetch('/projects/push', { method: 'POST' });
            const data = await res.json();
            zeigeGitAusgabe(data.ausgabe || (data.ok ? 'Push erfolgreich.' : 'Push fehlgeschlagen.'));
        } catch (err) {
            zeigeGitAusgabe('Fehler: ' + err.message);
        }
    });

    async function ladeProjekte() {
        try {
            const res = await fetch('/projects');
            const daten = await res.json();
            projektSelect.innerHTML = '';
            for (const p of daten.projekte) {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                if (p === daten.aktiv) opt.selected = true;
                projektSelect.appendChild(opt);
            }
        } catch (e) {
            console.error('Projektliste nicht ladbar:', e);
        }
    }

    async function projektAktivieren(name) {
        const res = await fetch('/projects/aktiv', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        if (res.ok) {
            await ladeGitLogUndRenderChat();
            ladeDateiListe();
            setTimeout(reloadPreview, 3500); // Vite braucht einen Moment
        }
    }

    projektSelect.addEventListener('change', function () {
        projektAktivieren(projektSelect.value);
    });

    neuesProjektBtn.addEventListener('click', async function () {
        const name = prompt('Name des neuen Projekts (Buchstaben/Zahlen/-/_):');
        if (!name) return;
        const res = await fetch('/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        if (res.ok) {
            await ladeProjekte();
            await ladeGitLogUndRenderChat();
            reloadPreview();
            ladeDateiListe();
        } else {
            alert('Projekt konnte nicht angelegt werden.');
        }
    });

    // ── Datei-Explorer ───────────────────────────────────────────────────
    const tabPreviewBtn = document.getElementById('tabPreviewBtn');
    const tabFilesBtn = document.getElementById('tabFilesBtn');
    const previewWrapper = document.getElementById('previewWrapper');
    const previewControls = document.getElementById('previewControls');
    const filesPanel = document.getElementById('filesPanel');
    const fileList = document.getElementById('fileList');
    const fileViewer = document.getElementById('fileViewer');
    const uploadForm = document.getElementById('uploadForm');
    const uploadDir = document.getElementById('uploadDir');
    const uploadFileInput = document.getElementById('uploadFileInput');
    const uploadStatus = document.getElementById('uploadStatus');

    function zeigeTab(name) {
        const istPreview = name === 'preview';
        previewWrapper.classList.toggle('hidden', !istPreview);
        previewControls.classList.toggle('hidden', !istPreview);
        filesPanel.classList.toggle('hidden', istPreview);
        filesPanel.classList.toggle('flex', !istPreview);
        tabPreviewBtn.classList.toggle('bg-gray-700', istPreview);
        tabPreviewBtn.classList.toggle('text-white', istPreview);
        tabPreviewBtn.classList.toggle('bg-gray-200', !istPreview);
        tabPreviewBtn.classList.toggle('text-gray-700', !istPreview);
        tabFilesBtn.classList.toggle('bg-gray-700', !istPreview);
        tabFilesBtn.classList.toggle('text-white', !istPreview);
        tabFilesBtn.classList.toggle('bg-gray-200', istPreview);
        tabFilesBtn.classList.toggle('text-gray-700', istPreview);
        if (!istPreview) ladeDateiListe();
    }

    function formatBytes(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function ladeDateiListe() {
        try {
            const res = await fetch('/projects/files');
            const data = await res.json();
            fileList.innerHTML = '';
            (data.files || []).forEach(f => {
                const item = document.createElement('div');
                item.className = 'file-list-item px-3 py-1.5 cursor-pointer border-b border-gray-100 flex justify-between gap-2';
                item.dataset.path = f.path;
                const nameSpan = document.createElement('span');
                nameSpan.className = 'truncate';
                nameSpan.textContent = f.path;
                const sizeSpan = document.createElement('span');
                sizeSpan.className = 'text-gray-400 text-xs whitespace-nowrap';
                sizeSpan.textContent = formatBytes(f.size);
                item.appendChild(nameSpan);
                item.appendChild(sizeSpan);
                item.addEventListener('click', () => zeigeDatei(f.path, item));
                fileList.appendChild(item);
            });
            if (!data.files || !data.files.length) {
                fileList.innerHTML = '<p class="text-sm text-gray-400 p-3">Keine Dateien im Projekt.</p>';
            }
        } catch (e) {
            fileList.innerHTML = '<p class="text-sm text-red-600 p-3">Dateiliste konnte nicht geladen werden.</p>';
        }
    }

    async function zeigeDatei(path, itemEl) {
        document.querySelectorAll('.file-list-item.active').forEach(el => el.classList.remove('active'));
        if (itemEl) itemEl.classList.add('active');
        fileViewer.innerHTML = '<p class="text-sm text-gray-400">Lädt …</p>';
        try {
            const res = await fetch('/projects/file?path=' + encodeURIComponent(path));
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Datei konnte nicht geladen werden.');
            if (data.binary) {
                fileViewer.innerHTML = '<p class="text-sm text-gray-500">Binärdatei (' + formatBytes(data.size) + ') — keine Textvorschau möglich.</p>';
                return;
            }
            const pre = document.createElement('pre');
            pre.className = 'text-xs whitespace-pre-wrap break-all bg-white border border-gray-200 rounded p-3';
            pre.textContent = data.content;
            fileViewer.innerHTML = '';
            if (data.truncated) {
                const hinweis = document.createElement('p');
                hinweis.className = 'text-xs text-yellow-600 mb-2';
                hinweis.textContent = 'Datei ist groß — nur der Anfang wird angezeigt.';
                fileViewer.appendChild(hinweis);
            }
            fileViewer.appendChild(pre);
        } catch (err) {
            fileViewer.innerHTML = '<p class="text-sm text-red-600">' + escapeHtml(err.message) + '</p>';
        }
    }

    uploadForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const datei = uploadFileInput.files[0];
        if (!datei) return;
        const formData = new FormData();
        formData.append('file', datei);
        formData.append('dir', uploadDir.value.trim());
        uploadStatus.textContent = 'Lädt hoch …';
        uploadStatus.classList.remove('hidden', 'text-red-600', 'text-green-600');
        try {
            const res = await fetch('/projects/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Upload fehlgeschlagen.');
            uploadStatus.textContent = 'Hochgeladen: ' + data.path;
            uploadStatus.classList.add('text-green-600');
            uploadFileInput.value = '';
            ladeDateiListe();
        } catch (err) {
            uploadStatus.textContent = 'Fehler: ' + err.message;
            uploadStatus.classList.add('text-red-600');
        }
    });

    ladeProjekte();
    ladeGitLogUndRenderChat();
    ladeDateiListe();
</script>
</body>
</html>
